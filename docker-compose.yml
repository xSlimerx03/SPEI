# @module       Infraestructura
# @file         docker-compose.yml
# @path         docker-compose.yml
# @author       Raúl Treviño Licona <raul.trevino@institucion.edu.mx>
# @date         2026-10-18
# @lastModified 2026-10-18
# @version      v1.0.0
# @license      Propietario - BigBitByte / Institución Educativa
#               Todos los derechos reservados.
# @description  Entorno contenerizado del SPEI (MP 3.5). Imágenes fijadas por
#               etiqueta y digest (MD 6.1); credenciales tomadas de .env
#               (MD 7.1); phpMyAdmin y MailHog solo en el perfil "dev".
# @requisitos   RS-001, RS-003, RNF-009, RNF-011
# @see          docs/decisiones/BBB_DT_Registro_v1.0.md (DT-002, DT-003, DT-006, DT-017, DT-026)
# ============================================================================

name: spei

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: dev
    image: spei-app:dev
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  db:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-file-per-table=ON
      - --innodb-flush-log-at-trx-commit=1
      # Permite crear triggers con el usuario de la aplicación con binlog activo (DT-026).
      - --log-bin-trust-function-creators=ON
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${FORWARD_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/01-spei-testing.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  phpmyadmin:
    image: phpmyadmin:5.2@sha256:da3c72f9886fca93037b740c93fe1697a7924fe6790a58733814cee61ec49af8
    profiles: ["dev"]
    ports:
      - "${FORWARD_PMA_PORT:-8080}:80"
    environment:
      PMA_HOST: db
    depends_on:
      - db

  mailhog:
    image: mailhog/mailhog:v1.0.1@sha256:8d76a3d4ffa32a3661311944007a415332c4bb855657f4f6c57996405c009bea
    profiles: ["dev"]
    ports:
      - "${FORWARD_MAILHOG_PORT:-8025}:8025"

volumes:
  db_data:
  redis_data:
