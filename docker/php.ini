; @description  Ajustes de PHP para el SPEI: zona horaria, límites de carga
;               (CSV de RF-012/RF-016) y opcache.
; @requisitos   RF-012, RF-016, RNF-009
; ============================================================================

date.timezone = America/Mexico_City
memory_limit = 512M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
expose_php = Off

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
